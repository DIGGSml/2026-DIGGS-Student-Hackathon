name: pile_stroke_log
description: "A pile driving hammer stroke measurement app using audio analysis."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.1
  mic_stream: ^0.7.2
  collection: ^1.18.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  csv: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.1.0
  path_provider: ^2.1.3
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.5.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  supabase_flutter: ^2.10.3
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hammer_database.csv
    - assets/h_pile_sections.csv
    - assets/pipe_pile_sections.csv
    - assets/square_pile_sections.csv
    - assets/octagonal_pile_sections.csv
    - assets/circular_pile_sections.csv
    - assets/h_pile_sections_en_10365.csv
    - assets/pipe_pile_section_en_10219.csv
